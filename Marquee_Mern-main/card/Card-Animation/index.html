<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e9edf1;

        }

        .card {
            width: 320px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 30px 25px 35px;
            text-align: center;
            position: relative;
        }

        .menu-dots {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ccc;
            font-size: 20px;
            line-height: 6px;
        }

        .avatar-wrap {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 10px auto 20px;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .verified-badge  {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 30px;
            height: 30px;
            background: #2ecc71;
            border-radius: 50%;
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            100% {
                opacity: 1;
                color: #2ecc71;
            }

            50% {
                opacity: 0.2;
                color:#2f2f2f;
            }
        }

        .name {
            font-size: 24px;
            color: #2f2f2f;
            margin: 0 0 4px;
        }

        .role {
            font-size: 14px;
            color: #9aa0a6;
            margin: 0 0 25px;
            font-family: Arial, sans-serif;
            letter-spacing: 0.5px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            margin-bottom: 25px;
        }

        .stat {
            flex: 1;
        }

        .stat-label {
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #9aa0a6;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 22px;
            color: #2f2f2f;
        }

        .bio {
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #9aa0a6;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 30px;
        }

        .socials a {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 15px;
            font-weight: bold;
        }

        .twitter {
            background: #4db8e8;
        }

        .facebook {
            background: #3b5998;
        }

        .google {
            background: #f16752;
        }

        .behance {
            background: #1769ff;
        }

        .view-profile {
            display: inline-block;
            width: 100%;
            padding: 16px 0;
            border: none;
            border-radius: 30px;
            background: #2bbbad;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="menu-dots">&#8942;</div>

        <div class="avatar-wrap">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTNfkC0WPbAgiEZ6guOlJxmaPiWTPFK4rZngBN-HzJyYuN86FE_lAwUapzy&s=10" alt="Profile photo">
            <div class="verified-badge"><i class="fa-solid fa-square-check"></i></div>
        </div>

        <h2 class="name">Vel Kumar P</h2>
        <p class="role">UI/UX Designer</p>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Projects</div>
                <div class="stat-value">11</div>
            </div>
            <div class="stat">
                <div class="stat-label">Following</div>
                <div class="stat-value">250</div>
            </div>
            <div class="stat">
                <div class="stat-label">Followers</div>
                <div class="stat-value">185</div>
            </div>
        </div>

        <p class="bio">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed et est et velit ornare ultrices. Ut vitae diam
            volutpatrisus eget.
        </p>

        <div class="socials">
            <a href="#" class="twitter">T</a>
            <a href="#" class="facebook">f</a>
            <a href="#" class="google">G+</a>
            <a href="#" class="behance">Be</a>
        </div>

        <button class="view-profile">View Profile</button>
    </div>

</body>

</html>
